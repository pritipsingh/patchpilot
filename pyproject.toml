[project]
name = "patchpilot"
version = "0.1.0"
description = "A Slack coding assistant with approval-gated pull requests and optional AgntID enforcement."
requires-python = ">=3.11,<4"
readme = "README.md"

dependencies = [
  "agno[os,slack,github]==3.0.5",
  "openai",
  "psycopg[binary]",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest", "pytest-asyncio"]
agntid = ["agntid-sdk @ git+https://github.com/AGNTID-AI/agntid-python.git@f4fcd2fe476f0c4dcf800e498530b7042b830f6b"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "tools*", "workspace*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["\\.venv.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
