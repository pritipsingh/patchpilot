name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt
          uv pip install ruff mypy pytest pytest-asyncio
          uv pip install -e '.[agntid]'

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy agents app db tools workspace

      # The guards are the security boundary: the command allowlist, the repo
      # allowlist and the branch prefix. They need no credentials and no network,
      # so they run on every pull request.
      - name: Tests
        run: uv run pytest tests -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image carries git and Node for the repos the agent works in, so a
      # broken Dockerfile is only visible here -- it built fine and crashed at
      # runtime once already.
      - name: Build the image
        run: docker build -t patchpilot:ci .
      - name: Dependencies actually resolved
        run: docker run --rm --entrypoint sh patchpilot:ci -c "python -c 'import agno, github, slack_sdk, psycopg' && git --version && node --version"
